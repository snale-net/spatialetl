name: Publish providers distribution 📦 to PyPI

on:
  push:
    tags:
      - 'providers-[a-z0-9]+/[0-9]+.[0-9]+.[0-9]+'
      - 'providers-common-[a-z0-9]+/[0-9]+.[0-9]+.[0-9]+'

jobs:
  release-checks:
    outputs:
      provider-name: ${{ steps.check-provider.outputs.provider-name }}
      provider-path: ${{ steps.check-provider.outputs.provider-path }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v2

      - name: "Find provider name from tag name"
        uses: actions-ecosystem/action-regex-match@v2
        id: provider-parser
        with:
            text: ${{ github.ref }}
            regex: '^refs\/tags\/providers-([a-z0-9-]+)\/.*$'

      - name: "Test if provider regex match"
        if: ${{ (steps.provider-parser.outputs.match != '') }}
        id: provider-match
        run: |          
          echo provider-path=$(echo spatialetl/providers/${{ steps.provider-parser.outputs.group1 }}) | sed 's/common-/common\//g' >> $GITHUB_OUTPUT

      - name: "Debug provider values"
        run: |
          echo "match='${{ steps.provider-parser.outputs.match }}'"
          echo "provider-path='${{ steps.provider-match.outputs.provider-path }}'"
          echo "hash='${{ hashFiles(steps.provider-match.outputs.provider-path) }}'"

      - name: "Check if provider path exists"
        if: >-
          ${{
            steps.provider-parser.outputs.match != '' &&
            steps.provider-match.outputs.provider-path != '' &&
            hashFiles(steps.provider-match.outputs.provider-path) != ''
          }}
        id: check-provider
        run: |
          echo provider-name=${{ steps.provider-parser.outputs.group1 }} >> $GITHUB_OUTPUT
          echo provider-path=${{ steps.provider-match.outputs.provider-path }} >> $GITHUB_OUTPUT

  publish-to-pypi:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-checks
    if: needs.release-checks.outputs.provider-name != ''
    environment:
      name: pypi
      url: https://pypi.org/p/spatialetl-providers-${{ needs.release-checks.outputs.provider-name }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build
      - name: Build package
        working-directory: ${{ needs.release-checks.outputs.provider-path }}
        run: |
          python -m build
      - name: "Publishing ${{ needs.release-checks.outputs.provider-name }} distribution 📦 to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ format('{0}/dist/', needs.release-checks.outputs.provider-path) }}
          skip-existing: true
          attestations: true