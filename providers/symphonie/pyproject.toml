[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "spatialetl-providers-symphonie"
version = "0.0.1"
requires-python = ">=3.9"
authors = [
  {name = "Fabien RÉTIF", email = "fabien.retif@snale.net"},
]
description = "Provider package spatialetl-providers-symphonie for SpatialETL"
readme = "README.md"

dependencies = [
  "spatialetl>=0.2.0",
  "spatialetl-providers-common-netcdf>=0.0.1",
  "numexpr==2.14.1"
]

[project.urls]
Homepage = "https://lab.snale.net/produits/pyspatialetl"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/snale-net/SpatialETL.git"

[dependency-groups]
dev = [
    "spatialetl",
    "spatialetl-providers-common-netcdf",
    # Additional devel dependencies (do not remove this line and add extra development dependencies)
]

[tool.uv.sources]
# These names must match the names as defined in the pyproject.toml of the workspace items,
# *not* the workspace folder paths
spatialetl = {workspace = true}
spatialetl-providers-common-netcdf = {workspace = true}

[tool.flit.module]
name = "spatialetl.providers.symphonie"